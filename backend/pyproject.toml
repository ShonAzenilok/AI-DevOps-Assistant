[project]
name = "devbot-backend"
version = "0.1.0"
description = "DevBot FastAPI backend — AWS MCP client + Ollama agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "boto3>=1.35.0",
    "mcp>=1.9.0",
    "mcp-proxy-for-aws>=1.6.0",
    "httpx>=0.28.0",
]

[project.scripts]
devbot = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
