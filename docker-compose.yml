services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      DEBUG_CODE_ROOT: "/app/hello-world"
      CORS_ORIGINS: '["http://localhost","http://127.0.0.1","http://localhost:5173","http://127.0.0.1:5173"]'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
